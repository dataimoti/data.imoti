<title>Имотна статистика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<style>
/* Layout: лява лента с иконки + основна област; в картата горе вляво са службата и периодът,
   горе вдясно бързите периоди и бутонът "!". Цветове: много светъл топъл фон,
   син за продажби, оранжев за годишната промяна. */
:root {
  --bg: #f9f9f7;
  --rail: #fbfbf9;
  --surface: #fefefd;
  --ink: #17191d;
  --ink2: #555b64;
  --muted: #8a9099;
  --line: #e7e6e1;
  --line2: #f1f0ec;
  --chip: #efeeea;
  --chip2: #e3e2dc;
  --dash: #c9c7bf;
  --s1: #2b6cdf;
  --s2: #cc650f;
  --focus: #2b6cdf;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --rail: #121316; --surface: #1a1b1f; --ink: #ececee; --ink2: #a6abb3; --muted: #7b808a;
    --line: #2d2f35; --line2: #24262b; --chip: #25272c; --chip2: #33363d; --dash: #43464e; --s1: #5a93f0; --s2: #d57a22; --focus: #5a93f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121316; --rail: #121316; --surface: #1a1b1f; --ink: #ececee; --ink2: #a6abb3; --muted: #7b808a;
  --line: #2d2f35; --line2: #24262b; --chip: #25272c; --chip2: #33363d; --dash: #43464e; --s1: #5a93f0; --s2: #d57a22; --focus: #5a93f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; margin: 0; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { display: grid; grid-template-columns: 92px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; display: flex; flex-direction: column; gap: 6px;
  padding: 18px 8px; border-right: 1px solid var(--line); background: var(--rail); }
.nav { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; border: 0; border-radius: 12px;
  background: transparent; color: var(--ink2); text-align: center; font-size: 10.5px; line-height: 1.2; font-weight: 500; text-wrap: balance; }
.nav:hover, .nav[aria-current="page"] { background: var(--chip); }
.ic { width: 26px; height: 26px; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }

.main { min-width: 0; padding-block: 16px 24px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
h1 { margin: 0 0 2px; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 0 0 12px; color: var(--ink2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.plot { min-width: 0; padding: 16px 18px 10px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; position: relative; padding-bottom: 6px; }
.titles { min-width: 0; }
.selwrap { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.selwrap::after { content: ""; position: absolute; left: 13px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); pointer-events: none; }
.sel { appearance: none; -webkit-appearance: none; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; padding: 3px 12px 3px 34px; max-width: 100%; text-overflow: clip; }
.sel:hover { background: var(--chip2); }
.sel.big { font-size: 20px; font-weight: 700; letter-spacing: -.005em; line-height: 1.3; }
.sel.mini-unused { font-size: 12.5px; font-weight: 600; color: var(--ink2); border-color: var(--line); margin-left: 0; padding: 3px 22px 3px 9px; background: var(--surface); border-radius: 999px; }
.sel option { color: #17191d; background: #ffffff; font-weight: 400; font-size: 14px; }
.periodline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; font-family: var(--font-num); font-size: 12.5px; color: var(--ink2); }
.hright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; height: 29px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink2); }
.chip:hover { background: var(--chip); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.info-btn { flex: none; width: 29px; height: 29px; border-radius: 50%; border: 1px solid #1e9a4b; background: #1e9a4b; color: #fff; font-weight: 700; font-size: 14px; line-height: 1; }
.info-btn:hover, .info-btn[aria-expanded="true"] { background: #17803d; border-color: #17803d; color: #fff; }
.pop { position: absolute; z-index: 5; right: 0; top: 100%; width: min(380px, calc(100vw - 48px)); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.pop h3 { margin: 0 0 8px; font-size: 14px; }
.pop h4 { margin: 10px 0 2px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pop p { margin: 0; font-size: 13px; color: var(--ink2); }
.pop a { color: var(--s1); }

.charts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.charts.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.cv { position: relative; min-width: 0; height: 436px; }
.cap { position: absolute; left: 8px; top: 0; z-index: 1; display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink2); pointer-events: none; }
.cap i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { width: 34px; height: 27px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); padding: 0; }
.seg button:hover { background: var(--chip); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--chip2); color: var(--ink); }
.seg svg { width: 16px; height: 16px; }
.ctrl { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 2px 0 6px; }
.period { font-family: var(--font-num); font-size: 12.5px; color: var(--ink2); }
.dl { display: inline-flex; align-items: center; gap: 6px; height: 29px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 12.5px; }
.dl:hover { background: var(--chip); }
.dl svg { width: 14px; height: 14px; }
.dlwrap { position: relative; }
.cvdl { position: absolute; right: 0; top: 0; z-index: 3; }
.cvdl .dlmenu { right: 0; }
.nav[data-view="contacts"] { margin-top: auto; }
.lang { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
.lb { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 4px; background: var(--surface); color: var(--ink2); font-size: 11px; font-weight: 600; }
.lb:hover { background: var(--chip); }
.lb[aria-pressed="true"] { background: var(--chip2); color: var(--ink); border-color: var(--muted); }
.dlmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; min-width: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.dlmenu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; font-size: 13px; }
.dlmenu button:hover { background: var(--chip); }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line2); margin-top: 6px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 4px 2px; border-bottom: 1px solid var(--line2); }
.srow:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.srow .nm { flex: 1; min-width: 0; font-size: 13px; }
.srow .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.tools { display: flex; gap: 4px; }
.tool { width: 30px; height: 22px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink2); padding: 0; }
.tool:hover { background: var(--chip); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.tool svg { width: 14px; height: 14px; }

.tablecard { margin-top: 12px; }
.thead { padding: 10px 18px 8px; }
.thead h2 { margin: 0; font-size: 15px; font-weight: 700; }
.scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 14px; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: max-content; min-width: 100%; font-family: var(--font-num); font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line2); }
thead th { font-weight: 500; color: var(--ink2); background: var(--surface); border-bottom: 1px solid var(--line); }
th.first, td.first { position: sticky; left: 0; z-index: 2; text-align: left; background: var(--surface); font-family: var(--font-ui); font-weight: 600;
  min-width: 250px; max-width: 250px; white-space: normal; border-right: 1px solid var(--line); }
td.first .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
td.first button { all: unset; cursor: pointer; }
td.first button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
tbody tr:last-child td { border-bottom: 0; }
.out { opacity: .42; }

.block { margin-bottom: 28px; }
.coming { padding: 40px 24px; text-align: center; color: var(--ink2); }

@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; justify-content: space-around; z-index: 6;
    padding-block: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .lang { margin-top: 0; flex-direction: row; }
  .nav[data-view="contacts"] { margin-top: 0; }
  .nav { flex: 1; flex-direction: row; justify-content: center; gap: 8px; font-size: 11px; padding: 8px 6px; }
  .ic { width: 20px; height: 20px; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; }
  h1 { font-size: 22px; }
  .cv { height: 400px; }
  .charts.two { grid-template-columns: minmax(0, 1fr); }
  th.first, td.first { min-width: 150px; max-width: 150px; }
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
</style>

  <main class="main">

                <button id="vTwo" aria-pressed="false" title="Две графики една до друга, по един показател" aria-label="Две графики една до друга"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="3" width="5.5" height="10" rx="1.2"/><rect x="9" y="3" width="5.5" height="10" rx="1.2"/></svg></button>
              </div>
              <button class="info-btn" id="infoBtn" aria-expanded="false" aria-controls="pop" aria-label="Информация за данните">!</button>
            </div>
            <div class="pop" id="pop" role="dialog" aria-label="Информация за данните" hidden></div>
          </div>
          <div class="ctrl"><span class="period" id="t-range"></span><div class="presets" id="presets"></div></div>
          <div class="charts" id="charts"></div>
          <div class="rows" id="rows"></div>
        </div>
      </section>

      <section class="card tablecard">
        <div class="thead"><h2 id="t-table"></h2></div>
        <div class="scroll" id="scroll"><table id="tbl"></table></div>
      </section>
     </div>
    </div>

    <div id="v-bnb" hidden><div class="card coming" id="c-bnb"></div></div>
    <div id="v-contacts" hidden><div class="card coming" id="c-contacts"></div></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>

    textStyle: { fontFamily: css("--font-ui") },
    grid: { left: pair ? 52 : 56, right: pair ? 62 : 16, top: pair ? 16 : 44, bottom: 58 },
    tooltip: { trigger: "axis", axisPointer: { type: "line", lineStyle: { color: muted, type: "dashed" } }, backgroundColor: surf, borderColor: css("--line"), borderWidth: 1,
      textStyle: { color: ink, fontFamily: css("--font-ui"), fontSize: 12.5 }, extraCssText: "border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);",
      formatter: (ps) => {
        const head = '<div style="font-weight:700;margin-bottom:6px">' + ps[0].axisValue + "</div>";
        const rows = ps.filter((p) => !S.hide[p.seriesId]).map((p) => '<div style="display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:' + (pair ? 230 : 150) + 'px"><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + p.color + ';margin-right:6px"></span>' + (pair ? p.seriesName : "") + '</span><b style="font-family:' + css("--font-num") + '">' + (p.seriesId === "yoy" ? pct(p.value) : fmt(p.value)) + "</b></div>").join("");
        const avgRows = ids.filter((id) => S.avg[id] && !S.hide[id] && avgOf(id) != null).map((id) => { const av = avgOf(id); return '<div style="display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:' + (pair ? 230 : 150) + 'px;color:' + ink2 + '"><span><span style="display:inline-block;width:18px;height:2px;background:repeating-linear-gradient(90deg,' + css(META[id].col) + ' 0 5px,transparent 5px 8px);margin-right:6px;vertical-align:middle"></span>' + T.avg + (pair ? " – " + META[id].short() : "") + '</span><b style="font-family:' + css("--font-num") + '">' + (id === "yoy" ? pct(av) : fmt(av)) + "</b></div>"; }).join("");
        return head + rows + (avgRows ? '<div style="border-top:1px solid ' + css("--line") + ';margin:6px 0 4px"></div>' + avgRows : "");
      } },
    xAxis: { type: "category", data: Q, boundaryGap: true, axisLine: { onZero: false, lineStyle: { color: css("--line") } }, axisTick: { show: false }, axisLabel: { color: muted, fontSize: 11, hideOverlap: true } },
    yAxis,
    dataZoom: [
      { type: "slider", xAxisIndex: 0, startValue: S.from, endValue: S.to, height: 24, bottom: 4, filterMode: "filter", brushSelect: false, showDataShadow: true,
        borderColor: css("--line"), backgroundColor: "transparent", fillerColor: "rgba(90,147,240,.16)", dataBackground: { lineStyle: { color: muted, width: 1 }, areaStyle: { color: css("--chip") } },
        selectedDataBackground: { lineStyle: { color: c1 }, areaStyle: { color: c1, opacity: .25 } }, handleSize: "120%", handleStyle: { color: surf, borderColor: ink2 },
        textStyle: { color: ink2, fontSize: 11 }, moveHandleSize: 6, labelFormatter: (v, str) => str },
      { type: "inside", xAxisIndex: 0, filterMode: "filter", zoomOnMouseWheel: "ctrl", moveOnMouseMove: true, moveOnMouseWheel: false }
    ],
    series: buildSeries(c)
  };
}
function refresh(c) { c.inst.setOption({ yAxis: axesFor(c), series: buildSeries(c) }); }
function render() { charts.forEach((c) => c.inst.setOption(option(c), true)); }
const ro = new ResizeObserver(() => charts.forEach((c) => { c.inst.resize(); refresh(c); }));

/* ---------- сваляне: точно това, което се вижда (без плъзгача) ---------- */
const closeMenus = () => document.querySelectorAll(".dlmenu").forEach((m) => { m.hidden = true; m.previousElementSibling?.setAttribute("aria-expanded", "false"); });
async function save(blob, name) {
  try { const d = window.claude && (await window.claude.use("downloads")); if (d) { await d.save({ filename: name, data: blob }); return; } } catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const fname = (c) => "prodazhbi-" + (S.office === ALL ? "bulgaria" : translit(S.office).toLowerCase().replace(/\s+/g, "-")) + (c.ids.length === 1 ? "-" + c.ids[0] : "") + "-" + Q[S.from].replace(" ", "") + "-" + Q[S.to].replace(" ", "");
function exportOption(c) {
  const o = option(c);
  o.animation = false; delete o.tooltip;
  o.dataZoom = [{ type: "inside", xAxisIndex: 0, startValue: S.from, endValue: S.to, filterMode: "filter" }];
  o.grid.bottom = 28;
  if (c.ids.length === 1) o.title = { text: META[c.ids[0]].name(), left: 6, top: 2, textStyle: { fontSize: 13, fontWeight: 600, color: css("--ink2"), fontFamily: css("--font-ui") } };
  return o;
}
async function exportPng(c) {
  const w = c.el.clientWidth, h = c.el.clientHeight - 30;
  let svg;
  try { const inst = echarts.init(null, null, { renderer: "svg", ssr: true, width: w, height: h }); inst.setOption(exportOption(c)); svg = inst.renderToSVGString(); inst.dispose(); }
  catch (e) { svg = c.inst.renderToSVGString(); }
  const im = new Image(); await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
  const cv = document.createElement("canvas"); cv.width = w * 2; cv.height = h * 2;
  const g = cv.getContext("2d"); g.fillStyle = css("--surface"); g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
  return new Promise((ok) => cv.toBlob(ok));
}
async function doDownload(kind, c) {
  if (kind === "csv") {
    const rows = [[T.quarter, ...c.ids.map((id) => META[id].name())]];
    for (let i = S.from; i <= S.to; i++) rows.push([Q[i], ...c.ids.map((id) => (id === "sales" ? cur.s[i] : cur.y[i]) ?? "")]);
    save(new Blob(["﻿" + rows.map((r) => r.join(";")).join("\n")], { type: "text/csv;charset=utf-8" }), fname(c) + ".csv");
  } else { const b = await exportPng(c); if (b) save(b, fname(c) + ".png"); }
}
function makeDl(c) {
  const w = document.createElement("div"); w.className = "dlwrap";
  const b = document.createElement("button"); b.className = "dl"; b.setAttribute("aria-haspopup", "true"); b.setAttribute("aria-expanded", "false"); b.append(T.download); b.insertAdjacentHTML("beforeend", ICON.dl);
  const m = document.createElement("div"); m.className = "dlmenu"; m.hidden = true;
  [["png", T.dlPng], ["csv", T.dlCsv]].forEach(([k, tx]) => { const x = document.createElement("button"); x.dataset.dl = k; x.textContent = tx; m.append(x); });
  b.onclick = (e) => { e.stopPropagation(); togglePop(false); const open = m.hidden; closeMenus(); m.hidden = !open; b.setAttribute("aria-expanded", String(open)); };
  m.onclick = (e) => { const k = e.target.dataset.dl; if (!k) return; closeMenus(); doDownload(k, c); };
  w.append(b, m); return w;
}

function mount() {
  ro.disconnect(); charts.forEach((c) => c.inst.dispose()); charts = [];
  const host = $("charts"); host.innerHTML = ""; host.className = "charts" + (S.split ? " two" : ""); $("dlSlot").innerHTML = "";
  (S.split ? [["sales"], ["yoy"]] : [["sales", "yoy"]]).forEach((ids) => {
    const el = document.createElement("div"); el.className = "cv"; el.setAttribute("role", "img");
    el.setAttribute("aria-label", ids.length === 2 ? T.chartPair : T.chartOne + META[ids[0]].name());
    host.append(el);
    const inst = echarts.init(el, null, { renderer: "svg" }), c = { inst, el, ids }; charts.push(c);
    if (S.split) {
      const cap = document.createElement("div"); cap.className = "cap"; const dot = document.createElement("i"); dot.style.background = "var(" + META[ids[0]].col + ")"; cap.append(dot, META[ids[0]].name());
      const d = document.createElement("div"); d.className = "cvdl"; d.append(makeDl(c)); el.append(cap, d);
    }
    inst.on("datazoom", () => {
      const o = inst.getOption().dataZoom[0], conv = (v) => (typeof v === "number" ? Math.round(v) : Q.indexOf(v));
      const a = conv(o.startValue), b = conv(o.endValue);
      if (a >= 0 && b >= 0 && (a !== S.from || b !== S.to)) setWindow(a, b, false, c);
    });
    ro.observe(el);
  });
  if (!S.split) $("dlSlot").append(makeDl(charts[0]));
  render();
  $("vOne").setAttribute("aria-pressed", String(!S.split)); $("vTwo").setAttribute("aria-pressed", String(S.split));
}

/* ---------- таблица ---------- */
function buildTable() {
  const { s, y } = cur, t = $("tbl");
  const idx = [...Q.keys()].reverse();
  const head = '<thead><tr><th class="first">' + T.thIndicator + "</th>" + idx.map((i) => '<th data-col="' + i + '">' + Q[i] + "</th>").join("") + "</tr></thead>";
  const row = (id, name, arr, f) => '<tr><td class="first"><button data-toggle="' + id + '" aria-pressed="' + !S.hide[id] + '" aria-label="' + (S.hide[id] ? T.show : T.hide) + " " + name + '"><span class="sw" style="background:var(' + META[id].col + ");opacity:" + (S.hide[id] ? 0.25 : 1) + '"></span>' + name + "</button></td>"
    + idx.map((i) => '<td data-col="' + i + '">' + f(arr[i]) + "</td>").join("") + "</tr>";
  t.innerHTML = head + "<tbody>" + row("sales", T.seriesSales + " (" + T.unitSales + ")", s, fmt) + row("yoy", T.yoyShort, y, pct) + "</tbody>";
  t.querySelectorAll("[data-toggle]").forEach((b) => (b.onclick = () => toggleHide(b.dataset.toggle)));
  syncControls();
}

/* ---------- събития ---------- */
function loadOffice() { cur = compute(S.office); buildTable(); if (charts.length) render(); fit($("selOffice")); }
function applyAll() { paintText(); fillSelects(); buildRows(); buildTable(); mount(); }
function setLang(l) { LANG = l; T = I18N[l]; try { localStorage.setItem("lang", l); } catch (e) {} applyAll(); }
document.querySelectorAll(".lb").forEach((b) => (b.onclick = () => { if (b.dataset.lang !== LANG) setLang(b.dataset.lang); }));
$("vOne").onclick = () => { if (S.split) { S.split = false; mount(); } };
$("vTwo").onclick = () => { if (!S.split) { S.split = true; mount(); } };
$("selOffice").onchange = (e) => { S.office = e.target.value; loadOffice(); };
const infoBtn = $("infoBtn"), pop = $("pop");
function togglePop(open) { pop.hidden = !open; infoBtn.setAttribute("aria-expanded", String(open)); }
infoBtn.onclick = (e) => { e.stopPropagation(); closeMenus(); togglePop(pop.hidden); };
document.addEventListener("click", (e) => { closeMenus(); if (!pop.hidden && !pop.contains(e.target)) togglePop(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { togglePop(false); closeMenus(); } });
document.querySelectorAll(".nav").forEach((b) => (b.onclick = () => {
  document.querySelectorAll(".nav").forEach((x) => x.removeAttribute("aria-current")); b.setAttribute("aria-current", "page");
  ["agency", "bnb", "contacts"].forEach((v) => ($("v-" + v).hidden = v !== b.dataset.view));
  if (b.dataset.view === "agency") charts.forEach((c) => c.inst.resize());
}));

/* ---------- старт ---------- */
async function boot() {
  let data = EMBEDDED;
  if (CONFIG.supabaseUrl && CONFIG.anonKey) {
    $("charts").textContent = "…";
    try { data = await loadFromSupabase(); } catch (e) { console.error(e); $("t-sub").dataset.err = String(e.message || e); }
  }
  D = data; Q = D.q; N = Q.length;
  S.from = 0; S.to = N - 1; if (!D.o[S.office]) S.office = Object.keys(D.o)[0];
  cur = compute(S.office);
  applyAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit($("selOffice")));
}
boot();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { render(); });
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
